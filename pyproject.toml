[project]
name = "polars-map"
version = "0.3.0"
description = "Polars plugin providing Map operations on List(Struct({key, value})) columns"
requires-python = ">=3.10"
dependencies = ["polars>=1.36,<2", "pyarrow>=17.0"]
readme = "README.md"
license = "MIT"
keywords = ["polars", "polars-plugin", "map", "arrow", "extension-type"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/hafacc/polars-map"
Repository = "https://github.com/hafacc/polars-map"
Documentation = "https://github.com/hafacc/polars-map#readme"
Issues = "https://github.com/hafacc/polars-map/issues"

[dependency-groups]
dev = [
    "myst-parser>=4.0.0",
    "pyarrow-stubs>=17.0",
    "pyright>=1.1",
    "pytest>=8.3",
    "pytest-cov>=7.1",
    "ruff>=0.11",
    "sphinx>=8.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
extend-select = ["I", "D", "A", "B", "W", "PL", "UP", "FIX"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pyright]
include = ["polars_map", "tests"]
strict = ["polars_map", "tests"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report term-missing"
